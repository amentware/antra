#:schema node_modules/wrangler/config-schema.json
name = "antraapp"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages reads its static output from here.
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
# Password-hashing work factor. Kept modest so PBKDF2 stays within the Workers
# free-tier CPU limit (~10 ms/request). Raise it if you move to a paid plan.
PBKDF2_ITERATIONS = "70000"

# D1 — the only database Antra uses.
# Create it with:  npx wrangler d1 create antra-db
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "antra-db"
database_id = "ff4a78e5-907f-4b52-9363-3ec7f5793685"

# Optional: KV namespace used to make login rate limiting global across
# isolates. Antra falls back to a D1-backed limiter when this is not bound.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
